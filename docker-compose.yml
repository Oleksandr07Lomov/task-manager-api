version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tasker_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasker_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:1234@db:5432/task_db
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    container_name: tasker_fronted
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./fronted:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data: